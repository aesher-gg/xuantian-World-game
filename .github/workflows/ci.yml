name: Build and validate Xuantian World

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - name: Test importer parser and validation
        run: npm test
      - name: Import canonical World Bible
        run: npm run import:world-bible
      - name: Build web game
        run: npm run build
      - name: Preserve validated World Bible import
        uses: actions/upload-artifact@v4
        with:
          name: xuantian-world-bible-import
          path: |
            world-bible/snapshots/
            world-bible/generated/
            public/data/world-bible/
          if-no-files-found: error
          retention-days: 30
